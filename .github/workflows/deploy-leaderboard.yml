name: deploy leaderboard

# Applies new database migrations, then deploys the Cloudflare Worker in
# leaderboard/. Runs when the Worker's files change on main, or by hand.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# (see leaderboard/DEPLOY.md); without them it exits without doing anything.
on:
  push:
    branches: [main]
    paths:
      - 'leaderboard/worker.js'
      - 'leaderboard/validate.js'
      - 'leaderboard/wrangler.toml'
      - 'leaderboard/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-leaderboard
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LEADERBOARD_URL: ${{ secrets.LEADERBOARD_URL }}
    defaults:
      run:
        working-directory: leaderboard
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set: nothing to deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      # Migrations first: the new Worker reads the new columns. Already applied ones are skipped.
      - if: steps.secrets.outputs.ok == 'true'
        run: npx --yes wrangler@4 d1 migrations apply follow-the-load --remote
      - if: steps.secrets.outputs.ok == 'true'
        run: npx --yes wrangler@4 deploy
      - name: Smoke test
        if: steps.secrets.outputs.ok == 'true' && env.LEADERBOARD_URL != ''
        run: |
          curl -fsS "$LEADERBOARD_URL/"
          curl -fsS "$LEADERBOARD_URL/scores?scenario=taiwan-2025&day=summerWeekday&difficulty=normal&limit=1"
