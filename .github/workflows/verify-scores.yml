name: verify leaderboard scores

# Replays pending leaderboard scores and marks them verified or rejected.
# Needs repository secrets LEADERBOARD_URL and LEADERBOARD_ADMIN_TOKEN
# (see leaderboard/DEPLOY.md); without them it exits without doing anything.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-scores
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags: each score is replayed with the version it was played on
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/verify-scores.js
        env:
          LEADERBOARD_URL: ${{ secrets.LEADERBOARD_URL }}
          LEADERBOARD_ADMIN_TOKEN: ${{ secrets.LEADERBOARD_ADMIN_TOKEN }}
